name: Accessibility barrier
description: Something in the library or docs excludes people with disabilities
title: '[a11y] '
labels: ['a11y', 'priority: p1']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a barrier. These are triaged with the same urgency as security
        issues, and the fix ships with a test that would have caught it.

        If this is a security vulnerability, do not use this form — see SECURITY.md.

  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What can you not do, and with what assistive technology?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of barrier
      options:
        - Name or label missing or wrong
        - Keyboard: unreachable, trap, or wrong order
        - Screen reader announcement
        - Contrast or colour-only information
        - Direction / RTL / bidi
        - Focus visibility
        - Motion, zoom or reflow
        - Documentation only
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, assistive technology and version.
      placeholder: Safari 17, macOS 15, VoiceOver
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where
      description: The component name, or the gallery URL, and the exact steps to reach the barrier.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read `docs/accessibility.md` and this is not a documented limit.
          required: true
