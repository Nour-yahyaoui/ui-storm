name: Feature request
description: A component, prop or capability that is missing
title: '[feature] '
labels: ['type: feature', 'priority: p3']
body:
  - type: markdown
    attributes:
      value: |
        The backlog is generated from `scripts/build_backlog.py`. If this request matches an
        existing issue, say so and the conversation can continue there.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to build, and who is blocked by it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: A builder call, the markup you would expect, and how it should behave in RTL and with no JavaScript.
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Which element and role would this use? What does it need from the keyboard, and what does a screen reader announce?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked `docs/backlog.md` for an existing issue.
          required: true
        - label: This is not a request to change the project's accessibility rules.
          required: true
