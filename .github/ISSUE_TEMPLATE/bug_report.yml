name: Bug report
description: Something behaves differently from the documentation
title: '[bug] '
labels: ['type: bug', 'priority: p2']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the problem is an accessibility barrier, use the
        accessibility template instead — those are triaged with higher urgency.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behaviour you saw, and the behaviour you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The builder call and the rendered markup, or the gallery URL that shows it.
      placeholder: |
        Input::new("email", "Email", "email").error("Required").render()
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A component
        - Direction / RTL
        - Tokens / contrast / theming
        - The gallery (ui-storm-web)
        - The enhancement script
        - Documentation
        - CI / tooling
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: ui-storm, Rust and the browser or assistive technology you used.
      placeholder: ui-storm 0.1.0, Rust 1.82, Firefox 130, NVDA 2024.4
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open issues for the same problem.
          required: true
        - label: I checked the component's gallery page, including its Known limits section.
          required: true
