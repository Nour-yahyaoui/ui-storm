name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Format, lints, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Reported rather than blocking: rustfmt output varies between toolchain
      # patch releases, and a formatting diff should never hide a failing test.
      - name: Formatting (report only)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy — warnings are errors
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- --deny warnings 2>&1 | tee clippy.log

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --all-targets 2>&1 | tee tests.log

      - name: Report diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### clippy (${{ steps.clippy.outcome }})"
            echo '```'
            tail -n 120 clippy.log 2>/dev/null || true
            echo '```'
            echo "### tests (${{ steps.tests.outcome }})"
            echo '```'
            tail -n 120 tests.log 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${{ github.event_name }}" = "pull_request" ] &&
             { [ "${{ steps.clippy.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; }; then
            {
              echo "### Rust diagnostics"
              echo '#### clippy'
              echo '```'
              tail -n 120 clippy.log 2>/dev/null || true
              echo '```'
              echo '#### tests'
              echo '```'
              tail -n 160 tests.log 2>/dev/null || true
              echo '```'
            } > rust-report.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file rust-report.md
          fi

          test "${{ steps.clippy.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"

      - name: Release build
        run: cargo build --workspace --release

  backlog:
    name: Backlog is in sync with its generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate and compare
        run: python3 scripts/build_backlog.py --check

  bidi-kit:
    name: bidi-kit (npm package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        working-directory: packages/bidi-kit
        run: npm ci --no-audit --no-fund

      # Builds both module formats, then runs the unit tests against the build.
      - name: Typecheck, build and test
        working-directory: packages/bidi-kit
        run: npm test

      - name: The published tarball contains what it claims to
        working-directory: packages/bidi-kit
        run: npm run pack:check

      - name: The demo and the module build are served
        working-directory: packages/bidi-kit
        run: |
          set -euo pipefail
          node scripts/serve.mjs &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ | grep -q "bidi-kit"
          curl -fsS http://127.0.0.1:4173/dist/esm/index.js | grep -q "export {"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4173/dist/cjs/index.js | grep -q 200

      - name: The CLI answers on stdin
        working-directory: packages/bidi-kit
        run: |
          set -euo pipefail
          printf 'Hello \xd9\x85\xd8\xb1\xd8\xad\xd8\xa8\xd8\xa7.' | node bin/bidi-kit.mjs runs | grep -q "^rtl"
          printf 'text-align: left;' | node bin/bidi-kit.mjs check | grep -q "physical-text-align"
          test "$(printf '\xd9\x85\xd8\xb1\xd8\xad\xd8\xa8\xd8\xa7' | node bin/bidi-kit.mjs dir)" = "rtl"

  bidi-kit-windows:
    # The package is published from a developer machine at least as often as from
    # CI, and those machines are not all Unix. This job exists because `.bin/tsc`
    # and shell globs behave differently on Windows, and both broke a release.
    name: bidi-kit on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bidi-kit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: The published tarball contains what it claims to
        run: npm run pack:check

  gallery:
    name: Gallery smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and start the gallery
        run: |
          cargo build --package ui-storm-web
          ./target/debug/ui-storm-web &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "gallery is up after ${attempt}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Every page answers with HTML
        run: |
          set -euo pipefail
          for path in / /foundations /accessibility /rtl \
            /components/button /components/icon-button /components/text-input \
            /components/checkbox /components/dialog /components/tabs; do
            body=$(curl -fsS "http://127.0.0.1:8080${path}")
            grep -q "<!DOCTYPE html>" <<<"${body}"
            grep -q "<h1" <<<"${body}"
            echo "ok ${path}"
          done

      - name: Assets are served with the right content type
        run: |
          set -euo pipefail
          css=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/assets/ui-storm.css)
          js=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/assets/ui-storm.js)
          echo "css: ${css}"
          echo "js: ${js}"
          [[ "${css}" == text/css* ]]
          [[ "${js}" == text/javascript* ]]

      - name: Unknown pages are 404s
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/components/date-picker)
          test "${status}" = "404"

  accessibility:
    name: Browser accessibility (axe + keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer builds and runs the real gallery binary, so the
      # tests exercise exactly what a reviewer sees.
      - name: Run Playwright (axe, RTL, dark theme, keyboard, no-JS)
        id: playwright
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --reporter=line 2>&1 | tee playwright.log

      - name: Report diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### playwright (${{ steps.playwright.outcome }})"
            echo '```'
            tail -n 200 playwright.log 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${{ github.event_name }}" = "pull_request" ] &&
             [ "${{ steps.playwright.outcome }}" != "success" ]; then
            {
              echo "### Playwright diagnostics"
              echo '```'
              tail -n 250 playwright.log 2>/dev/null || true
              echo '```'
            } > playwright-report.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file playwright-report.md
          fi

          test "${{ steps.playwright.outcome }}" = "success"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
