name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Format, lints, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Reported rather than blocking: rustfmt output varies between toolchain
      # patch releases, and a formatting diff should never hide a failing test.
      - name: Formatting (report only)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy — warnings are errors
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- --deny warnings 2>&1 | tee clippy.log

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --all-targets 2>&1 | tee tests.log

      - name: Report diagnostics
        if: always()
        run: |
          {
            echo "### clippy (\${{ steps.clippy.outcome }})"
            echo '```'
            tail -n 150 clippy.log 2>/dev/null || true
            echo '```'
            echo "### tests (\${{ steps.tests.outcome }})"
            echo '```'
            tail -n 150 tests.log 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          test "\${{ steps.clippy.outcome }}" = "success"
          test "\${{ steps.tests.outcome }}" = "success"

      - name: Release build
        run: cargo build --workspace --release

  backlog:
    name: Backlog is in sync with its generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and compare
        run: python3 scripts/build_backlog.py --check

  gallery:
    name: Gallery smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and start the gallery
        run: |
          cargo build --package ui-storm-web
          ./target/debug/ui-storm-web &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "gallery is up after ${attempt}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Every page answers with HTML
        run: |
          set -euo pipefail
          for path in / /foundations /accessibility /rtl \
            /components/button /components/icon-button /components/text-input \
            /components/checkbox /components/dialog /components/tabs; do
            body=$(curl -fsS "http://127.0.0.1:8080${path}")
            grep -q "<!DOCTYPE html>" <<<"${body}"
            grep -q "<h1" <<<"${body}"
            echo "ok ${path}"
          done

      - name: Assets are served with the right content type
        run: |
          set -euo pipefail
          css=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/assets/ui-storm.css)
          js=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/assets/ui-storm.js)
          echo "css: ${css}"
          echo "js: ${js}"
          [[ "${css}" == text/css* ]]
          [[ "${js}" == text/javascript* ]]

      - name: Unknown pages are 404s
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/components/date-picker)" = "404"

  accessibility:
    name: Browser accessibility (axe + keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer builds and runs the real gallery binary, so the
      # tests exercise exactly what a reviewer sees.
      - name: Run Playwright (axe, RTL, dark theme, keyboard, no-JS)
        id: playwright
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --reporter=line 2>&1 | tee playwright.log

      - name: Report Playwright diagnostics
        if: always()
        run: |
          {
            echo "### playwright (\${{ steps.playwright.outcome }})"
            echo '```'
            grep -E "✘|Error|expect|Received|Expected|error" playwright.log | head -n 120 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          test "\${{ steps.playwright.outcome }}" = "success"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
